<div class="auth-shell login-shell">
  <form class="auth-card" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>
        <strong>Aggrio</strong>
        <small>Panel de administración</small>
      </span>
    </div>

    <p class="eyebrow">Acceso</p>
    <h1>Inicia sesión</h1>
    <p class="subtitle">Ingresa tus credenciales para entrar al panel.</p>

    @if (notice()) {
      <p class="alert info">{{ notice() }}</p>
    }

    @if (error()) {
      <p class="alert error" role="alert">{{ error() }}</p>
    }

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
        [disabled]="isLoading()"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>

    <div class="field">
      <label for="password">Contraseña</label>
      <div class="password-wrap">
        <input
          id="password"
          name="password"
          [type]="showPassword() ? 'text' : 'password'"
          autocomplete="current-password"
          required
          [disabled]="isLoading()"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
        />
        <button
          class="peek"
          type="button"
          (click)="togglePassword()"
          [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          [attr.title]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
        >
          @if (showPassword()) {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M3 3l18 18M10.6 10.6a2 2 0 002.8 2.8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              <path d="M9.9 5.2A10.8 10.8 0 0112 5c5.2 0 9 4.4 10 7-.4 1.1-1.3 2.5-2.7 3.8M6.2 6.2C3.9 7.7 2.5 10 2 12c1 2.6 4.8 7 10 7 1.2 0 2.3-.2 3.3-.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          } @else {
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
              <path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" />
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" />
            </svg>
          }
        </button>
      </div>
    </div>

    <button class="button" type="submit" [disabled]="isLoading() || !email() || !password()">
      {{ isLoading() ? 'Verificando…' : 'Entrar' }}
    </button>

    <p class="foot">
      <a class="linkish" routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>
    </p>
    <p class="home-link">
      <a [href]="publicSiteUrl">Volver a la página principal</a>
    </p>
  </form>
</div>
