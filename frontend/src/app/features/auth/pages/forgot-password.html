<div class="auth-shell">
  <form class="auth-card" (ngSubmit)="submit()">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">A</span>
      <span>
        <strong>Aggrio</strong>
        <small>Recuperar contraseña</small>
      </span>
    </div>

    <p class="eyebrow">Recuperación</p>
    <h1>¿Olvidaste tu contraseña?</h1>
    <p class="subtitle">
      Escribe tu correo y te enviaremos un enlace para crear una contraseña nueva.
    </p>

    @if (notice()) {
      <p class="alert success">{{ notice() }}</p>
    }

    @if (error()) {
      <p class="alert error" role="alert">{{ error() }}</p>
    }

    <div class="field">
      <label for="email">Correo electrónico</label>
      <input
        id="email"
        name="email"
        type="email"
        autocomplete="username"
        required
        [disabled]="isLoading()"
        [ngModel]="email()"
        (ngModelChange)="email.set($event)"
      />
    </div>

    <button class="button" type="submit" [disabled]="isLoading() || !email()">
      {{ isLoading() ? 'Enviando…' : 'Enviar enlace' }}
    </button>

    <p class="foot">
      <a class="linkish" routerLink="/auth/login">Volver al inicio de sesión</a>
    </p>
  </form>
</div>
